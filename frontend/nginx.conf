server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;                      # ne pas afficher la version de nginx

    # En-têtes de sécurité de base
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Les appels /api sont relayés vers le backend : même origine pour le navigateur, donc pas de CORS
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI du backend, accessible via le même port
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
    }

    # Fichiers avec hash dans le nom : cache long
    location ~* \.(js|css|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Routage Angular : toute URL inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
