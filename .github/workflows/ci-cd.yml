name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write        # pour publier les images dans GitHub Container Registry

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build et tests
        run: ./mvnw -B verify

      - name: Rapports de tests (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-surefire
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Tests
        run: npx ng test --watch=false
      - name: Build
        run: npx ng build

  images:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Publication seulement sur main ; sur une pull request, on vérifie juste que les images se construisent
    env:
      PUBLIER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      matrix:
        include:
          - nom: secutrack-api
            contexte: backend
          - nom: secutrack-web
            contexte: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        if: env.PUBLIER == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags de l'image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.nom }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (et push sur main)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.contexte }}
          push: ${{ env.PUBLIER == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.nom }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nom }}
