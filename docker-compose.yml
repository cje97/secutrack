# SecuTrack complet : PostgreSQL + API Spring Boot + frontend Angular (nginx)
# Lancement : docker compose up --build   puis   http://localhost:8081
services:
  # Base de données PostgreSQL. Les données sont conservées dans le volume "pgdata".
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secutrack
      POSTGRES_USER: secutrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secutrack}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # healthcheck : Docker vérifie que PostgreSQL accepte les connexions avant de démarrer le backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secutrack -d secutrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API Spring Boot, construite avec backend/Dockerfile
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker          # charge application-docker.yml (PostgreSQL)
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secutrack}
      JWT_SECRET: ${JWT_SECRET:-secret-docker-a-remplacer-par-une-valeur-aleatoire-longue}
      DEMO_ACTIF: ${DEMO_ACTIF:-true}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy            # attend que la base soit prête

  # Angular servi par nginx, qui relaie aussi /api vers le service "backend"
  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
